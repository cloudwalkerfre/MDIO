# ./pyproject.toml
[tool.uv]
package = false

[dependency-groups]
dev = ["mdio-py", "maturin>=1.4,<2.0"]

[project]
name = "mdio"
version = "0.8.5"
description = "MDIO Concept"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.3,<2",
    "lark-cython>=0.0.17",
    "anyio>=4.0.0",
    "any-llm-sdk>=1.29.0",       # 统一 LLM 后端（litellm 已退役）
    "litestar>=2.24.0",
    "granian[reload]>=2.8.0",
    "msgspec>=0.20.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "click>=8.3",
    "prompt_toolkit>=3.0.0",
    "bm25s>=0.3.0,<0.4.0",
    "jieba",
    "platformdirs>=4.0.0",
    "croniter>=6.0.0",
    "pexpect>=4.9.0",
    "psutil>=7.2,<8",
    "nah>=0.9.1,<1.0",
    "uvloop>=0.22.1",
    "dateparser>=1.4.0",
    "aiohttp",
    "httpx",
    "iroh>=1.0.0",
    "websockets>=16.0",
    "pandas>=3.0",                  # wl 装配:pandas 做拓扑表/开集/plan(六步流水线第 2 步)
]

[project.scripts]
mdio = "mdio_py.cli:main"

# --- UV Workspace Config ---
[tool.uv.workspace]
members = ["mdio_py"]

[tool.uv.sources]
# 这里的配置允许我们在 workspace 内部直接引用兄弟包
mdio-py = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# [tool.hatch.build]
# # 空 include 列表，表示这是个元包
# include = []

[tool.maturin]
manifest-path = "mdio_core/Cargo.toml"
module-name = "mdio_py.mdio_core"
python-source = "mdio_py/src"
# 默认构建**不带 telemetry**：crate 自身声明它是「分析专用」的 opt-in feature
# （见 mdio_core/Cargo.toml [features]：实测开销 19-28%）。需要 telemetry 分析时用
# `--features telemetry` 单独构建，不要把它写进默认配置。
features = ["python"]

[tool.pytest.ini_options]
# 仓库根目录运行 `pytest mdio_py/tests` 时使用本配置；
# mdio_py 目录内运行使用 mdio_py/pyproject.toml。
addopts = [
  "--ignore-glob=*test_telemetry_e2e.py",
  "--ignore-glob=*test_telemetry_integration.py",
]
timeout = 300
