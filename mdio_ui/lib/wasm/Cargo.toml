[package]
name = "editor-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# WASM基础
wasm-bindgen = "=0.2.108"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    # 基础特性
    "console", "Window", "Performance", "WorkerGlobalScope",

    # 流API（WebTransport必需）
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "WritableStream",
    "WritableStreamDefaultWriter",

    # WebSocket降级方案
    "WebSocket",
] }
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2", features = ["serde"] }
ws_stream_wasm = "0.7"

# 核心算法
crop = { version = "0.4.3", features = ["utf16-metric", "serde"] }
cola = { version = "0.5", features = ["serde"] }

url = "2.4"
futures = { version = "0.3", features = ["compat"] }
gloo-timers = { version = "0.3", features = ["futures"] }
anyhow = "1.0"
bytes = "1.4"

console_error_panic_hook = "0.1"

# 可选特性
[features]
default = ["nodejs"]
nodejs = []       # Node.js 适配 (VS Code 扩展) — 替换 transport + get_performance
metrics = []      # 性能监控
debug = []        # 调试信息
websocket = []    # WebSocket降级方案

[profile.release]
lto = true
opt-level = "z"    # 最小体积优化
codegen-units = 1
panic = "abort"    # 生产环境panic立即中止