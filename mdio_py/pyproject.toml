# mdio_py/pyproject.toml

[project]
name = "mdio-py"
version = "0.8.5"
description = "MDIO Logic SDK & Runtime"
dependencies = [
    "lark==1.3.1",
    "anyio>=4.0.0",  # 用于 Async Task 封装
    "any-llm-sdk>=1.29.0",       # 统一 LLM 后端（litellm 已退役）
    "litestar>=2.24.0",
    "granian[reload,uvloop]>=2.7.8",
    "msgspec>=0.20.0",
    "pytest>=9.0.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "lark-cython>=0.0.17",
    "json_repair>=0.58.7",
    "click>=8.3",
    "prompt_toolkit>=3.0.0",
    "bm25s>=0.3.0,<0.4.0",
    "jieba",
    "platformdirs>=4.0.0",
    "croniter>=6.0.0",
    "pexpect>=4.9.0",
    "psutil>=7.2,<8",
    "nah>=0.7.0",
    "pytest-asyncio>=1.0.0",
    "pytest-xdist>=3.8.0",  # addopts -n auto 多进程并行依赖
    "pytest-timeout>=2.3.1",
    "tabulate>=0.10.0",
    "polars>=1.43.1",
    "duckdb>=2.0.0",
    "dateparser>=1.4.0",
    "aiohttp",
    "httpx",
    "iroh>=1.0.0",
    "websockets>=16.0",
    "pandas>=3.0",
]
requires-python = ">=3.11"

[project.scripts]
mdio = "mdio_py.cli:main"

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../mdio_core/Cargo.toml"
module-name = "mdio_py.mdio_core"
features = ["python", "persistence"]  # telemetry opt-in: 分析时加回并 rebuild
python-source = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 300
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = ["telemetry"]  # telemetry/ 为手动验证/性能分析脚本目录, 非 pytest 目标
addopts = [
  "-n", "auto",  # 多进程并行: 每进程独立线程池, 规避 MdioRuntime 线程峰值(每实例+6线程, 回收依赖 loop 关闭)
  "--ignore-glob=*test_telemetry_e2e.py",
  "--ignore-glob=*test_telemetry_integration.py",
]
markers = [
  "persist: 需要 MDIO_PERSIST=1 的持久化行为断言测试(AP 计划 §5)",
  "slow: 满载/长时间集成测试；默认 test-py 排除，单独 test-py-slow 运行",
  "perf: 时序/性能阈值敏感测试；默认 test-py 排除，CI 不跑",
]

