[workspace]
resolver = "2"
members = [
    "mdio_core",
    "mdio_core/ext/*",
    "tools/dircheck",
    "mdio_ui/lib/wasm"
]

default-members = [
    "mdio_core",
    "tools/dircheck",
    "mdio_ui/lib/wasm"
]

# 本地 debug/test 构建加速：只保留行号调试信息，减小 target 体积、加快编译
# 不影响 release 运行性能；如需完整调试变量可改回 debug = 2
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

# (可选) 统一 workspace 级别的依赖版本
# 这样子 crate 只需要写 version.workspace = true
[workspace.dependencies]
pyo3 = { version = "0.29.0", features = ["generate-import-lib"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"