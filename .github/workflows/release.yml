name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown
      - name: bootstrap wasm tools
        run: bash mdio_ui/lib/wasm/scripts/bootstrap-wasm-tools.sh
      - name: verify full chain
        run: python3 tools/build_grid/runner.py verify
      # PyPI rejects plain linux_x86_64 wheels. auditwheel with its automatic
      # platform picks the lowest manylinux policy the wheel actually needs and
      # emits a single tag (manylinux_2_34_x86_64). Passing --plat explicitly
      # produced a compressed tag (manylinux_2_34.manylinux_2_39) that pip
      # refuses to install.
      - name: retag wheel for PyPI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          uv tool install auditwheel
          uv tool run auditwheel repair -w dist dist/*.whl
          rm -f dist/*-linux_x86_64.whl
          ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
