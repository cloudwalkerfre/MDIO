name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-needed:
    # Path filters are not evaluated for tag pushes, so decide inside the run:
    # a docs-only tag move must not rebuild the wheel and republish it.
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: check whether code changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          if [ -z "$base" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD | grep -vE \
            '(^docs/|^LICENSE|\.md$|\.txt$|\.png$|\.jpe?g$|\.gif$|\.webp$|\.svg$)' || true)"
          echo "changed code paths: ${changed:-<none>}"
          if [ -n "$changed" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: build-needed
    if: needs.build-needed.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown
      - name: bootstrap wasm tools
        run: bash mdio_ui/lib/wasm/scripts/bootstrap-wasm-tools.sh
      - name: verify full chain
        run: python3 tools/build_grid/runner.py verify
      # PyPI rejects plain linux_x86_64 wheels. auditwheel with its automatic
      # platform picks the lowest manylinux policy the wheel actually needs and
      # emits a single tag (manylinux_2_34_x86_64). Passing --plat explicitly
      # produced a compressed tag (manylinux_2_34.manylinux_2_39) that pip
      # refuses to install.
      - name: retag wheel for PyPI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          uv tool install auditwheel
          uv tool run auditwheel repair -w dist dist/*.whl
          rm -f dist/*-linux_x86_64.whl
          ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Re-running a tag must not fail when the files are already on PyPI.
          skip-existing: true
