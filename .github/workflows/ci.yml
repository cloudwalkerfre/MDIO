name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # macOS runners hit the per-user thread limit; split the suite into
      # sequential processes so each one starts from a small thread count.
      MDIO_PYTEST_CHUNKS: ${{ matrix.os == 'macos-latest' && '4' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - name: system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: doctor
        run: python3 tools/build_grid/runner.py doctor
      - name: test
        run: python3 tools/build_grid/runner.py test

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown
      - name: bucket wasm tools
        run: bash mdio_ui/lib/wasm/scripts/bootstrap-wasm-tools.sh
      - name: ui doctor
        run: python3 tools/build_grid/runner.py ui:doctor
      - name: ui bundle
        run: python3 tools/build_grid/runner.py ui:bundle
