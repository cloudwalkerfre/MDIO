name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # macOS runners cap a process at ~kern.num_threads/5 threads (~2047 on the
      # hosted VMs), and each engine instance costs ~6 threads until its loop is
      # closed, so a single long pytest process runs out around 450 tests.
      # Ten chunks keep every process near 240 tests; verified in a 4-core/8GB
      # macOS VM with the same 2047-thread cap.
      MDIO_PYTEST_CHUNKS: ${{ matrix.os == 'macos-latest' && '10' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - name: system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: doctor
        run: python3 tools/build_grid/runner.py doctor
      - name: test
        run: python3 tools/build_grid/runner.py test

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown
      - name: bucket wasm tools
        run: bash mdio_ui/lib/wasm/scripts/bootstrap-wasm-tools.sh
      - name: ui doctor
        run: python3 tools/build_grid/runner.py ui:doctor
      - name: ui bundle
        run: python3 tools/build_grid/runner.py ui:bundle
