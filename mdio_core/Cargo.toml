[package]
name = "mdio_core"
version = "0.8.5"
edition = "2021"
description = "Markdown engine core: parser, CRDT, VFS, projection and WAL"
license = "MIT"
repository = "https://github.com/cloudwalkerfre/MDIO"
keywords = ["markdown", "parser", "crdt", "vfs", "editor"]
categories = ["text-processing", "parser-implementations", "data-structures"]
autobins = false
exclude = ["ext"]

[lib]
name = "mdio_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python", "persistence"]  # telemetry 分析专用——opt-in(--features telemetry); 发布/默认构建不带(19-28% 实测开销)
trinity-obs = []  # trinity 判官的 obs 绑定面（唯一生产 import 口）——opt-in
python = ["pyo3", "pythonize"]
telemetry = []  # 启用延迟统计（会有轻微性能开销）
persistence = [] # 构建常量:开关职责迁移至 MDIO_PERSIST(缺省 false);此处仅供裁剪,
# --no-default-features = 弃权(env=1 也不生效)

[dependencies]
crop = { version = "0.4.3", features = ["serde"] }
cola = { version = "0.5.1", default-features = false, features = ["encode", "serde"] }
opendal = { version = "0.55", default-features = false, features = ["services-memory", "services-fs", "blocking"] }
tokio = { version = "1.50", features = ["rt-multi-thread"] }
crossbeam = "0.8"
arc-swap = "1.9"
ahash = { version = "0.8", features = ["serde"] }
# slotmap = { version = "1.1", features = ["serde"] }
smallvec = { version = "1.15", features = ["serde", "write"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: serde_json::Value::Object 用 IndexMap 保插入序,
# 使 tree→serde 输出与 BufWriter 手写序逐字节一致 (golden 差分可复用)。
serde_json = { version = "1.0", features = ["preserve_order"] }
bincode = { version = "2", features = ["serde"] }
rand = "0.9.2"
pyo3 = { version = "0.29.0", optional = true, features = ["abi3-py311"] }
pythonize = { version = "0.29.0", optional = true }
parking_lot = "0.12"
memchr = "2.8"  # SIMD Search for -->
dashmap = "6.1"
walkdir = "2.5"
regex = "1.12"
tiktoken-rs = "0.9.1"
anyhow = "1.0"
globset = "0.4"
sha2 = "0.10"
crc32fast = "1.4"
gix = { version = "0.83", features = ["blob-diff"] }
diffy = "0.4"
phf = { version = "0.11", features = ["macros"] }
cputicks = "0.1"

# 仅用于 benchmark 的依赖
[dev-dependencies]
clap = { version = "4.4", features = ["derive"] }
# 方向闸单源化：probe 引用扫描器的表与规则
mdio-dircheck = { path = "../tools/dircheck" }
# tokio = { version = "1.0", features = ["full"] }

